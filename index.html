<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Steam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#">Steam</a>
                <input class="form-control f-a" type="search" placeholder="Пошук" aria-label="Search">
                <button class="btn btn-outline-light" type="submit">Пошук</button>
                <button class="btn btn-outline-light">Розпродаж</button>
                <button class="btn btn-outline-light">Бібліотека</button>
                <button class="btn btn-outline-light">Профіль</button>
            </div>
        </nav>
    </header>
    
    <div class="container-gol">
      <div class="cards">
        <div class="card" id="1">
          <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1811260/capsule_616x353.jpg?t=1697046405" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">FIFA 23</h5>
            <p class="card-text">Відкрийте для себе світ футболу з новими жіночими командами та ігровими режимами.</p>
            <a href="#" class="btn btn-primary">Детальніше</a>
          </div>
        </div>
        <div class="card" id="2">
          <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1222680/header.jpg?t=1777414224" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Need for Speed Heat</h5>
            <p class="card-text">Відкрийте для себе світ футболу з новими жіночими командами та ігровими режимами.</p>
            <a href="#" class="btn btn-primary">Детальніше</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
