<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand text-white" href="index.html" id="va">Steam</a>
          <input class="form-control f-a" id="catalog-search" type="search" placeholder="Пошук" aria-label="Пошук ігор">
          <button class="btn btn-outline-light" id="catalog-search-button" type="button">Пошук</button>
          <a class="btn btn-outline-light" href="#game-sale">Розпродаж</a>
          <button class="btn btn-outline-light" id="cart-button" type="button">Кошик (<span id="cart-count">0</span>)</button>
          <div class="not-loged">
            <button class="btn btn-outline-light" id="btny" type="button">Увійти</button>
          </div>
          <div class="loged">
            <button class="btn btn-outline-light" id="btnx" type="button">Бібліотека</button>
            <button class="btn btn-outline-light" id="logout-btn" type="button">Вийти</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="container-reccomend" aria-labelledby="featured-title">
        <h2 class="w2" id="featured-title">Відібране і рекомендоване</h2>
        <div class="games">
          <button class="game-arrow-prev btn btn-link text-white text-decoration-none fs-1 p-0" type="button" aria-label="Попередня гра">&lsaquo;</button>
          <div class="slide" id="featured-slide" aria-live="polite"></div>
          <button class="game-arrow-next btn btn-link text-white text-decoration-none fs-1 p-0" type="button" aria-label="Наступна гра">&rsaquo;</button>
        </div>
      </section>

      <section class="sale-section" id="game-sale" aria-labelledby="sale-title">
        <h2 class="sale-title" id="sale-title">Розпродаж</h2>
        <div class="sale-carousel">
          <button class="sale-arrow" id="sale-previous" type="button" aria-label="Попередні ігри розпродажу">&lsaquo;</button>
          <div class="sale-grid" id="sale-grid" aria-live="polite"></div>
          <button class="sale-arrow" id="sale-next" type="button" aria-label="Наступні ігри розпродажу">&rsaquo;</button>
        </div>
        <p class="sale-pagination" id="sale-pagination" aria-live="polite"></p>
      </section>

      <section class="catalog-section" aria-labelledby="catalog-title">
        <h2 class="w2" id="catalog-title">Каталог ігор</h2>
        <div class="container-gol">
          <div class="cards" id="catalog-cards" aria-live="polite"></div>
        </div>
      </section>
      <p class="site-message" id="site-message" role="status" aria-live="polite"></p>
    </main>

    <dialog class="game-details-dialog" id="game-details-dialog" aria-labelledby="game-details-title">
      <button class="game-dialog-close" id="close-game-details" type="button" aria-label="Закрити">&times;</button>
      <div class="game-details-content">
        <div class="game-details-top">
          <img class="game-details-image" id="game-details-image" alt="">
          <div class="game-details-info">
            <h2 id="game-details-title"></h2>
            <p id="game-details-description"></p>
            <dl class="game-meta">
              <div><dt>Дата виходу</dt><dd id="game-details-release"></dd></div>
              <div><dt>Розробник</dt><dd id="game-details-developer"></dd></div>
              <div><dt>Видавець</dt><dd id="game-details-publisher"></dd></div>
            </dl>
            <div class="game-purchase-row">
              <div class="price game-details-price">
                <del id="game-details-original-price" hidden></del>
                <span class="price-value" id="game-details-price"></span>
              </div>
              <button class="btn btn-primary" id="add-to-cart-button" type="button">Додати у кошик</button>
            </div>
            <p class="cart-feedback" id="game-cart-feedback" role="status" aria-live="polite"></p>
          </div>
        </div>
        <section class="game-requirements" aria-labelledby="requirements-title">
          <h3 id="requirements-title">Системні вимоги для ПК</h3>
          <div class="requirements-columns">
            <div><h4>Мінімальні</h4><ul id="minimum-requirements"></ul></div>
            <div><h4>Рекомендовані</h4><ul id="recommended-requirements"></ul></div>
          </div>
        </section>
      </div>
    </dialog>

    <dialog class="cart-dialog" id="cart-dialog" aria-labelledby="cart-title">
      <button class="game-dialog-close" id="close-cart" type="button" aria-label="Закрити">&times;</button>
      <div class="cart-dialog-content">
        <h2 id="cart-title">Кошик</h2>
        <div id="cart-items"></div>
        <p class="cart-total" id="cart-total"></p>
        <button class="btn btn-primary" id="checkout-button" type="button">Придбати</button>
        <p class="cart-feedback" id="cart-message" role="status" aria-live="polite"></p>
      </div>
    </dialog>

    <footer class="bg-dark text-white text-center py-3">
      <p>&copy; 2026 A and I studio</p>
    </footer>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
  </body>
</html>
