<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — SteamSite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <form class="form" id="register-form">
        <span class="input-span">
            <label for="email" class="label">Пошта</label>
            <input type="email" name="email" id="email" autocomplete="email" required
            /></span>
        <span class="input-span">
            <label for="password" class="label">Пароль</label>
            <input type="password" name="password" id="password" autocomplete="new-password" minlength="8" required
            /></span>
        <span class="input-span">
            <label for="confirm-password" class="label">Підтвердіть пароль</label>
            <input type="password" name="confirm-password" id="confirm-password" autocomplete="new-password" minlength="8" required
            /></span>
        <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        <input class="submit" type="submit" value="Зареєструватися" />
        <span class="span">Маєте обліковий запис? <a href="login.html">Увійти</a></span>
    </form>
    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
